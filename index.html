<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAMUSAP Tracker v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0E2338; --navy-800:#153351; --navy-700:#1F4E79;
  --navy-600:#2A6296; --navy-500:#3C7EBF; --navy-050:#EEF3F9;
  --orange-600:#C8621B; --orange-500:#E8792B; --orange-400:#F5A55E; --orange-050:#FDF1E7;
  --ink:#12202F; --muted:#5B6B7D; --line:#E3E8EE; --bg:#F6F8FB; --white:#fff;
  --red-600:#C0392B; --red-500:#E04B37; --red-050:#FDEDEA;
  --yellow-500:#F2C230; --yellow-050:#FEF8E4;
  --green-600:#1E7A55; --green-050:#E8F5EF;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(14,35,56,.06),0 8px 24px rgba(14,35,56,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--bg);
  color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;line-height:1.2}
a{color:var(--navy-600);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:3px solid var(--orange-400);outline-offset:2px;border-radius:4px}

.hidden{display:none !important}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.mt16{margin-top:16px}
.mb18{margin-bottom:18px}

.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:10px 18px;
  border-radius:var(--r-sm);font-weight:600;font-size:14px;
  transition:background .15s ease,box-shadow .15s ease,transform .06s ease}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--orange-500);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--orange-600)}
.btn-navy{background:var(--navy-700);color:#fff}
.btn-navy:hover:not(:disabled){background:var(--navy-800)}
.btn-ghost{background:var(--white);color:var(--navy-700);box-shadow:inset 0 0 0 1px var(--line)}
.btn-ghost:hover:not(:disabled){background:var(--navy-050)}
.btn-danger{background:var(--red-050);color:var(--red-600);box-shadow:inset 0 0 0 1px #F3C9C2}
.btn-danger:hover:not(:disabled){background:#FBDDD7}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-icon{padding:6px 9px;border-radius:6px;font-size:13px;color:var(--muted);font-weight:600}
.btn-icon:hover{background:var(--navy-050);color:var(--navy-700)}

#signinView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1100px 620px at 15% -10%,var(--navy-700) 0%,var(--navy-900) 58%,#08192a 100%)}
.signin-card{width:100%;max-width:430px;background:var(--white);border-radius:var(--r-lg);
  padding:38px 34px;box-shadow:0 24px 60px rgba(0,0,0,.30)}
.brand-rule{width:46px;height:4px;background:var(--orange-500);border-radius:3px;margin-bottom:18px}
.signin-eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-600);font-weight:700}
.signin-card h1{font-size:29px;margin:6px 0 8px;font-weight:700}
.lede{color:var(--muted);font-size:14px;margin-bottom:26px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;padding:13px;
  border-radius:var(--r-sm);font-weight:600;background:var(--navy-700);color:#fff}
.gbtn:hover{background:var(--navy-800)}
.gbtn svg{background:#fff;border-radius:3px;padding:2px}
.signin-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

.topbar{background:var(--navy-900);color:#fff;position:sticky;top:0;z-index:40}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:62px}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;display:flex;align-items:center;gap:9px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--orange-500);flex:none}
.logo .sub{font-family:'Plus Jakarta Sans';font-weight:500;font-size:11.5px;color:#9DB3C8;letter-spacing:0}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy-600);display:grid;place-items:center;
  font-weight:700;font-size:13px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.who-name{font-size:13.5px;font-weight:600;line-height:1.2}
.who-role{font-size:11px;color:#9DB3C8;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.linkout{color:#9DB3C8;font-size:13px;font-weight:600}
.linkout:hover{color:#fff}

.nav{background:var(--navy-800);border-bottom:3px solid var(--orange-500);position:sticky;top:62px;z-index:35}
.nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.navbtn{padding:13px 17px;color:#B9CBDC;font-weight:600;font-size:14px;white-space:nowrap;
  border-bottom:3px solid transparent;margin-bottom:-3px}
.navbtn:hover{color:#fff}
.navbtn.active{color:#fff;border-bottom-color:var(--orange-500)}

.page{padding:30px 0 90px}
.page-head{margin-bottom:22px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head h2{font-size:26px;font-weight:700}
.page-head p{color:var(--muted);font-size:14px;margin-top:4px}


.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat{border-radius:var(--r-md);padding:16px 18px;color:#fff;transition:transform .12s ease}
.stat:hover{transform:translateY(-2px)}
.stat.navy{background:var(--navy-800)}
.stat.orange{background:var(--orange-500)}
.stat.red{background:var(--red-600)}
.stat.green{background:var(--green-600)}
.stat .n{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;opacity:.9;margin-top:2px}

.panel{background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h3{font-size:15.5px;font-weight:700}
.panel-body{padding:20px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 20px;
  background:var(--navy-050);border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px}
.field > label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ctl{padding:8px 11px;border-radius:7px;border:1px solid var(--line);background:var(--white);min-width:140px}
.ctl:focus{border-color:var(--navy-500);outline:none;box-shadow:0 0 0 3px rgba(42,98,150,.14)}
.ctl.wide{min-width:220px}
.checkline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);
  text-transform:none;letter-spacing:0;padding-bottom:8px}

.tbl-wrap{overflow:auto;max-height:620px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{position:sticky;top:0;background:var(--navy-800);color:#fff;text-align:left;padding:11px 14px;
  font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;z-index:2;white-space:nowrap}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:hover td{background:var(--navy-050)}
table.tbl tr.is-overdue td:first-child,
table.tbl tr.is-today td:first-child,
table.tbl tr.is-urgent td:first-child{box-shadow:inset 3px 0 0 var(--red-500)}
table.tbl tr.is-soon td:first-child{box-shadow:inset 3px 0 0 var(--yellow-500)}
.t-title{font-weight:700;color:var(--ink)}
.t-desc{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:340px}
.cell-actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.act-wa{color:#128C7E;font-weight:700}
.act-wa:hover{background:#E4F5F1;color:#0B6B5F}
.act-mail{color:var(--navy-700);font-weight:700}
.act-msg{color:var(--orange-600);font-weight:700}
.act-msg:hover{background:var(--orange-050);color:var(--orange-600)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
.pill-red{background:var(--red-050);color:var(--red-600)}
.pill-yellow{background:var(--yellow-050);color:#8A6A05}
.pill-green{background:var(--green-050);color:var(--green-600)}
.pill-navy{background:var(--navy-050);color:var(--navy-700)}
.pill-orange{background:var(--orange-050);color:var(--orange-600)}
.pill-grey{background:#EEF1F5;color:var(--muted)}
.pill-flash{animation:flash 1.15s ease-in-out infinite}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.42}}

.firm-card{background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow);
  border-left:5px solid var(--navy-600);overflow:hidden;margin-bottom:16px}
.firm-card.owner{border-left-color:var(--orange-500)}
.firm-head{padding:15px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.firm-head h3{font-size:16.5px;font-weight:700}
.person{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:none}
.person .avatar{background:var(--navy-050);color:var(--navy-700)}
.person-name{font-weight:600;font-size:14px}
.person-mail{font-size:12.5px;color:var(--muted);word-break:break-all}

.empty{text-align:center;padding:44px 22px;color:var(--muted)}
.empty h4{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13.5px;max-width:440px;margin:0 auto}
.empty .btn{margin-top:16px}
.notice{background:var(--orange-050);border-left:4px solid var(--orange-500);border-radius:var(--r-sm);
  padding:14px 16px;font-size:13.5px}
.notice strong{display:block;margin-bottom:3px;font-weight:700}
code.inline{background:var(--navy-050);padding:2px 7px;border-radius:5px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}

#blockedView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.blocked-card{max-width:520px;background:var(--white);border-radius:var(--r-lg);padding:34px;
  box-shadow:var(--shadow);border-top:5px solid var(--orange-500)}
.blocked-card h2{font-size:22px;margin-bottom:8px}
.blocked-card p{font-size:14px;color:var(--muted);margin-bottom:14px}

.backdrop{position:fixed;inset:0;background:rgba(9,22,36,.55);z-index:70;display:flex;
  align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--white);border-radius:var(--r-lg);width:100%;max-width:620px;
  box-shadow:0 30px 70px rgba(0,0,0,.35);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal.narrow{max-width:460px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-head h3{font-size:18px;font-weight:700}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:16px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:10px;
  justify-content:flex-end;background:var(--navy-050)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.form-field .req{color:var(--red-500)}
.form-field input,.form-field select,.form-field textarea{padding:10px 12px;border-radius:7px;
  border:1px solid var(--line);background:var(--white);width:100%}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  border-color:var(--navy-500);outline:none;box-shadow:0 0 0 3px rgba(42,98,150,.14)}
.form-field input:disabled{background:var(--navy-050);color:var(--muted)}
.form-field textarea{resize:vertical;min-height:80px}
.form-field .hint{font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}

/* ---------- task detail ---------- */
.detail-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;
  background:var(--navy-050);border-radius:var(--r-sm);padding:14px 16px}
.detail-meta div span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:2px}
.detail-meta div strong{font-size:13.5px;font-weight:600}
.detail-desc{font-size:14px;white-space:pre-wrap;color:var(--ink)}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}

.attach-list{display:flex;flex-direction:column;gap:8px}
.attach{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--white)}
.attach .an{font-weight:600;font-size:13.5px;word-break:break-all}
.attach .au{font-size:11.5px;color:var(--muted)}
.attach-add{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:end}

.thread{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;padding-right:4px}
.msg{border-radius:var(--r-sm);padding:11px 13px;border:1px solid var(--line);background:var(--white)}
.msg.mine{background:var(--navy-050);border-color:#D6E2F0}
.msg.admin-msg{border-left:3px solid var(--orange-500)}
.msg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.msg-who{font-weight:700;font-size:12.5px}
.msg-when{font-size:11px;color:var(--muted)}
.msg-body{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.compose{display:flex;flex-direction:column;gap:8px}
.compose textarea{min-height:66px}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--orange-500);display:inline-block;flex:none}

/* ---------- notifications ---------- */
.bell{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.10);color:#C7D6E5;font-size:13px;font-weight:600}
.bell:hover{background:rgba(255,255,255,.18);color:#fff}
.bell.has-unread{background:var(--orange-500);color:#fff}
.bell-icon{font-weight:600}
.bell-badge{background:rgba(0,0,0,.24);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700}
.notif-list{display:flex;flex-direction:column;gap:8px}
.notif{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r-sm);text-align:left;width:100%;background:var(--white)}
.notif:hover{background:var(--navy-050);border-color:#D6E2F0}
.notif .unread-dot{margin-top:6px}
.notif-title{display:block;font-weight:700;font-size:13.5px}
.notif-sub{display:block;font-size:12px;color:var(--muted);margin-top:1px}

.meter{position:fixed;right:14px;bottom:14px;z-index:60;background:var(--navy-900);color:#fff;
  border-radius:999px;padding:7px 14px;font-size:11.5px;font-weight:600;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:7px}
.meter .dot{width:7px;height:7px;border-radius:50%;background:var(--green-600)}
.meter.warn .dot{background:var(--yellow-500)}
.meter.high .dot{background:var(--red-500)}

#toasts{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{background:var(--navy-900);color:#fff;padding:12px 16px;border-radius:var(--r-sm);font-size:13.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.24);border-left:4px solid var(--orange-500);animation:slidein .22s ease}
.toast.ok{border-left-color:var(--green-600)}
.toast.err{border-left-color:var(--red-500)}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

#bootView{min-height:100vh;display:grid;place-items:center;background:var(--bg)}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--orange-500);
  border-radius:50%;animation:spin .8s linear infinite}
.spinner.sm{width:18px;height:18px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:10px;padding:34px;justify-content:center;color:var(--muted);font-size:13.5px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
@media (max-width:760px){
  .topbar .wrap{height:56px;gap:10px}
  .who-name,.logo .sub{display:none}
  .nav{top:56px}
  .page-head h2{font-size:22px}
  .form-row{grid-template-columns:1fr}
  .ctl{min-width:120px}
  .t-desc{display:none}
}
</style>
</head>
<body>

<div id="bootView"><div class="spinner"></div></div>

<div id="signinView" class="hidden">
  <div class="signin-card">
    <div class="brand-rule"></div>
    <div class="signin-eyebrow">IAMUSAP Ventures</div>
    <h1>Work &amp; Compliance Tracker</h1>
    <p class="lede">Assigned work, partner firms and statutory deadlines in one place.</p>
    <button class="gbtn" id="btnSignin">
      <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
    <div class="signin-foot">Access is by invitation. If your email is not registered you will be told on the next screen.</div>
  </div>
</div>

<div id="blockedView" class="hidden">
  <div class="blocked-card">
    <h2 id="blockedTitle">Account not registered</h2>
    <p id="blockedMsg"></p>
    <div class="notice" id="blockedHint"></div>
    <div class="row mt16">
      <button class="btn btn-navy" id="btnBlockedRetry">Try again</button>
      <button class="btn btn-ghost" id="btnBlockedOut">Sign out</button>
    </div>
  </div>
</div>

<div id="appView" class="hidden">
  <header class="topbar">
    <div class="wrap">
      <div class="logo"><span class="dot"></span>IAMUSAP <span class="sub">Work &amp; Compliance Tracker</span></div>
      <div class="spacer"></div>
      <button class="bell" id="btnNotif" title="New messages">
        <span class="bell-icon">Messages</span><span class="bell-badge" id="notifCount">0</span>
      </button>
      <div class="who">
        <div class="avatar" id="uAvatar"></div>
        <div>
          <div class="who-name" id="uName"></div>
          <div class="who-role" id="uRole"></div>
        </div>
      </div>

/* Firestore rejects undefined outright — strip before every write. */
function clean(obj){
  const out = {};
  Object.keys(obj).forEach(function(k){ if (obj[k] !== undefined) out[k] = obj[k]; });
  return out;
}

function slugify(s){
  return String(s || '').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'firm';

function validEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim()); }

/* ---------- dates & urgency: one source of truth ---------- */
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }

function toDate(v){
  if (!v) return null;
  if (v instanceof Date) return v;
  if (typeof v.toDate === 'function') return v.toDate();
  const p = new Date(v);
  return isNaN(p.getTime()) ? null : p;
}

function daysUntil(deadline){
  const d = toDate(deadline);
  if (!d) return null;
  return Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000);
}

function urgency(deadline, status){
  if (status === 'completed') return { key:'done', label:'Completed', cls:'pill-green', flash:false };
  const n = daysUntil(deadline);
  if (n === null) return { key:'none', label:'No deadline', cls:'pill-grey', flash:false };
  if (n < 0)   return { key:'overdue', label:'Overdue by ' + Math.abs(n) + (Math.abs(n)===1?' day':' days'), cls:'pill-red', flash:false };
  if (n === 0) return { key:'today',   label:'Due today', cls:'pill-red', flash:true };
  if (n <= 2)  return { key:'urgent',  label:n + (n===1?' day left!':' days left!'), cls:'pill-red', flash:true };
  if (n <= 7)  return { key:'soon',    label:n + ' days left', cls:'pill-yellow', flash:false };
  return { key:'later', label:'Due in ' + n + ' days', cls:'pill-navy', flash:false };
}

function fmtDate(v){
  const d = toDate(v);
  if (!d) return '—';
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function toInputDate(v){
  const d = toDate(v);
  if (!d) return '';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function nextComplianceDate(month, day){
  const today = startOfDay(new Date());
  let c = startOfDay(new Date(today.getFullYear(), month-1, day));
  if (c < today) c = startOfDay(new Date(today.getFullYear()+1, month-1, day));
  return c;
}

/* ---------- contact links ----------
   These build a link that OPENS WhatsApp or the mail app with the message
   already written. The person still taps send. A browser cannot send on
   its own, and it cannot read replies back — that is what the "log a
   reply" box and the in-app thread are for. */
function phoneDigits(raw){
  let d = String(raw || '').replace(/\D/g,'');
  if (!d) return '';
  if (d.length === 10) d = '91' + d;              // bare Indian mobile
  if (d.length === 11 && d.charAt(0) === '0') d = '91' + d.slice(1);
  return d;
}

function waLink(phone, text){
  const d = phoneDigits(phone);
  if (!d) return '';
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text);
}

/* mailto: hands off to whatever the computer thinks is the default mail
   program — often Outlook, sometimes nothing at all. This opens Gmail in
   the browser directly, which is what actually happens on your machines. */
function gmailLink(email, subject, body){
  if (!email) return '';
  return 'https://mail.google.com/mail/?view=cm&fs=1' +
    '&to=' + encodeURIComponent(email) +
    '&su=' + encodeURIComponent(subject) +
    '&body=' + encodeURIComponent(body);
}

function mailLink(email, subject, body){
  if (!email) return '';
  return 'mailto:' + encodeURIComponent(email) +
    '?subject=' + encodeURIComponent(subject) +
    '&body=' + encodeURIComponent(body);
}

function firstName(name){ return String(name || '').trim().split(/\s+/)[0] || 'there'; }

function loadScript(src){
  return new Promise(function(resolve, reject){
    if (document.querySelector('script[src="' + src + '"]')) return resolve();
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function(){ reject(new Error('Could not load ' + src)); };
    document.head.appendChild(s);
  });
}

/* ---------- data layer ---------- */
async function loadProfile(email){
  if (cache.profile) return cache.profile;
  const snap = await readDoc(db.collection('users').doc(email));
  if (!snap.exists) return null;
  const d = snap.data() || {};
  d.email = (d.email || email).toLowerCase();
  cache.profile = d;
  return d;
}

async function loadDirectory(force){
  if (cache.directory && !force) return cache.directory;
  const snap = await readDoc(db.collection('meta').doc('directory'));
  const d = snap.exists ? (snap.data() || {}) : {};
  cache.directory = { firms: d.firms || [], people: d.people || [] };
  return cache.directory;
}

async function rebuildDirectory(){
  const firmsSnap  = await readQuery(db.collection('firms'));
  const peopleSnap = await readQuery(db.collection('users'));
  const firms = [];
  firmsSnap.forEach(function(doc){
    const d = doc.data() || {};
    firms.push({ id:doc.id, name:d.name || doc.id, active:d.active !== false });
  });
  const people = [];
  peopleSnap.forEach(function(doc){
    const d = doc.data() || {};
    people.push({
      email: doc.id, name: d.name || doc.id, role: d.role || 'partner',
      firmId: d.firmId || '', firmName: d.firmName || '',
      phone: d.phone || '', active: d.active !== false
    });
  });
  await db.collection('meta').doc('directory').set({ firms:firms, people:people, updatedAt: FV.serverTimestamp() });
  cache.directory = { firms:firms, people:people };
  return cache.directory;
}

async function loadTasks(force){
  if (cache.tasks && !force) return cache.tasks;
  let q = db.collection('tasks');
  if (isAdmin()) q = q.orderBy('deadline','asc').limit(TASK_LIMIT);
  // Partners filter only — sorting happens in sortByDeadline() in the browser.
  // This deliberately avoids a composite index, so onboarding a new person
  // never stalls waiting for one to build.
  else q = q.where('assigneeEmail','==', myEmail()).limit(TASK_LIMIT);
  const snap = await readQuery(q);
  const rows = [];
  snap.forEach(function(doc){
    const d = doc.data() || {};
    d.id = doc.id;
    rows.push(d);
  });
  cache.tasks = rows;
  return rows;
}

async function signIn(){
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt:'select_account' });
  try {
    await auth.signInWithPopup(provider);
  } catch (err){
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    if (err.code === 'auth/popup-blocked'){ toast('Your browser blocked the sign-in window. Allow pop-ups and try again.','err'); return; }
    if (err.code === 'auth/unauthorized-domain'){ toast('This address is not authorised in Firebase. Add it under Authentication → Settings → Authorized domains.','err'); return; }
    console.error(err);
    toast('Sign-in failed: ' + (err.message || err.code), 'err');
  }
}

async function signOut(){
  cache.clear();
  session.user = session.profile = session.role = null;
  await auth.signOut();
}

/* ---------- stats & filtering ---------- */
function liveTasks(rows){ return rows.filter(function(t){ return !t.archived; }); }

function computeStats(rows){
  const s = { overdue:0, today:0, week:0, completed:0, total:0 };
  liveTasks(rows).forEach(function(t){
    s.total++;
    const u = urgency(t.deadline, t.status);
    if (u.key === 'done'){ s.completed++; return; }
    if (u.key === 'overdue') s.overdue++;
    else if (u.key === 'today') s.today++;
    else if (u.key === 'urgent' || u.key === 'soon') s.week++;
  });
  return s;
}

function applyFilters(rows){
  const from = filters.from ? startOfDay(new Date(filters.from)) : null;
  const to   = filters.to   ? startOfDay(new Date(filters.to))   : null;
  const q    = filters.q.trim().toLowerCase();

  return rows.filter(function(t){
    if (!filters.archived && t.archived) return false;
    if (filters.archived && !t.archived) return false;
    if (filters.firm && t.firmId !== filters.firm) return false;
    if (filters.person && t.assigneeEmail !== filters.person) return false;
    if (filters.status && t.status !== filters.status) return false;
    if (filters.urgency && urgency(t.deadline, t.status).key !== filters.urgency) return false;
    if (from || to){
      const d = toDate(t.deadline);
      if (!d) return false;
      const dd = startOfDay(d);
      if (from && dd < from) return false;
      if (to && dd > to) return false;
    }
    if (q){
      const hay = ((t.title||'') + ' ' + (t.description||'') + ' ' + (t.assigneeName||'') + ' ' + (t.firmName||'')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function sortByDeadline(rows){
  return rows.slice().sort(function(a,b){
    const da = toDate(a.deadline), dbb = toDate(b.deadline);
    if (!da && !dbb) return 0;
    if (!da) return 1;
    if (!dbb) return -1;
    return da - dbb;
  });
}

/* Contact buttons live on the row itself — one tap from the list, no
   need to open the task first. Admins get WhatsApp and email (which open
   the app with the message already written); everyone gets Message,
   which posts straight into the in-app thread. */
function rowActionsHtml(t, withEdit){
  let html = '';
  if (isAdmin()){
    const person = (cache.directory && cache.directory.people || [])
      .find(function(p){ return p.email === t.assigneeEmail; }) || {};
    if (phoneDigits(person.phone)){
      html += '<button class="btn-icon act-wa" data-wa="' + esc(t.id) + '" title="Open WhatsApp with the reminder written">WhatsApp</button>';
    }
    html += '<button class="btn-icon act-mail" data-mail="' + esc(t.id) + '" title="Open email with the reminder written">Email</button>';
  }
  html += '<button class="btn-icon act-msg" data-msg="' + esc(t.id) + '" title="Post a message inside the app">' +
    (isAdmin() ? 'Message' : 'Reply') + '</button>';
  if (withEdit){
    html += '<button class="btn-icon" data-edit="' + esc(t.id) + '">Edit</button>' +
      '<button class="btn-icon" data-arch="' + esc(t.id) + '">' + (t.archived ? 'Restore' : 'Archive') + '</button>';
  }
  return html;
}

function taskTable(rows, opts){
  if (!rows.length){
    return '<div class="empty"><h4>Nothing here</h4><p>No tasks match the current filters.</p></div>';
  }
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    '<th>Task</th><th>Assigned to</th><th>Deadline</th><th>Urgency</th><th>Status</th><th>Priority</th>' +
    '<th>Contact</th></tr></thead><tbody>' +
    rows.map(function(t){ return taskRow(t, opts); }).join('') + '</tbody></table></div>';
}

/* Every table renders Open and contact buttons; this wires them all. */
function wireTaskOpen(container){
  container.querySelectorAll('[data-open]').forEach(function(b){
    b.addEventListener('click', function(){ openTaskDetail(b.dataset.open); });
  });
  container.querySelectorAll('[data-msg]').forEach(function(b){
    b.addEventListener('click', function(){ openQuickMessage(b.dataset.msg); });
  });
  container.querySelectorAll('[data-wa]').forEach(function(b){
    b.addEventListener('click', function(){ chaseFromRow(b.dataset.wa, 'whatsapp'); });
  });
  container.querySelectorAll('[data-mail]').forEach(function(b){
    b.addEventListener('click', function(){ chaseFromRow(b.dataset.mail, 'email'); });
  });
}

function personRow(p){
  return '<div class="person">' +
    '<div class="avatar">' + esc(initials(p.name)) + '</div>' +
    '<div><div class="person-name">' + esc(p.name) +
      (p.role === 'admin' ? ' <span class="pill pill-orange">Admin</span>' : '') +
      (p.active === false ? ' <span class="pill pill-grey">Inactive</span>' : '') + '</div>' +
      '<div class="person-mail">' + esc(p.email) + (p.phone ? ' · ' + esc(p.phone) : '') + '</div></div>' +
    '<div class="spacer"></div>' +
    '<button class="btn btn-ghost btn-sm" data-editperson="' + esc(p.email) + '">Edit</button>' +
  '</div>';
}

/* ---------- work table + filters ---------- */
function renderFilterBar(dir){
  const bar = $('filterBar');
  if (!bar) return;

  const firmOpts = ['<option value="">All firms</option>'].concat(dir.firms.map(function(f){
    return '<option value="' + esc(f.id) + '"' + (filters.firm===f.id?' selected':'') + '>' + esc(f.name) + '</option>';
  })).join('');

  const peopleOpts = ['<option value="">Everyone</option>'].concat(
    dir.people.filter(function(p){ return !filters.firm || p.firmId === filters.firm; }).map(function(p){
      return '<option value="' + esc(p.email) + '"' + (filters.person===p.email?' selected':'') + '>' + esc(p.name) + '</option>';
    })).join('');

  bar.innerHTML =
    '<div class="field"><label>Firm</label><select class="ctl" id="fFirm">' + firmOpts + '</select></div>' +
    '<div class="field"><label>Person</label><select class="ctl" id="fPerson">' + peopleOpts + '</select></div>' +
    '<div class="field"><label>Status</label><select class="ctl" id="fStatus"><option value="">Any status</option>' +
      Object.keys(STATUS).map(function(k){
        return '<option value="' + k + '"' + (filters.status===k?' selected':'') + '>' + STATUS[k].label + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Urgency</label><select class="ctl" id="fUrg"><option value="">Any urgency</option>' +
      '<option value="overdue"' + (filters.urgency==='overdue'?' selected':'') + '>Overdue</option>' +
      '<option value="today"'   + (filters.urgency==='today'?' selected':'')   + '>Due today</option>' +
      '<option value="urgent"'  + (filters.urgency==='urgent'?' selected':'')  + '>Within 2 days</option>' +
      '<option value="soon"'    + (filters.urgency==='soon'?' selected':'')    + '>Within 7 days</option>' +
      '<option value="later"'   + (filters.urgency==='later'?' selected':'')   + '>Later</option></select></div>' +
    '<div class="field"><label>From</label><input type="date" class="ctl" id="fFrom" value="' + esc(filters.from) + '"></div>' +
    '<div class="field"><label>To</label><input type="date" class="ctl" id="fTo" value="' + esc(filters.to) + '"></div>' +
    '<div class="field"><label>Search</label><input type="search" class="ctl wide" id="fQ" placeholder="Title, person, firm…" value="' + esc(filters.q) + '"></div>' +
    '<div class="field"><label class="checkline"><input type="checkbox" id="fArch"' + (filters.archived?' checked':'') + '> Archived</label></div>' +
    '<div class="field"><button class="btn btn-ghost btn-sm" id="fClear">Clear</button></div>';

  function bind(id, key, refreshBar){
    const el = $(id);
    if (!el) return;
    const ev = (el.type === 'search' || el.type === 'text') ? 'input' : 'change';
    el.addEventListener(ev, function(){
      filters[key] = (el.type === 'checkbox') ? el.checked : el.value;
      if (refreshBar){ filters.person = ''; renderFilterBar(cache.directory); }
      renderWorkTable();
    });
  }
  bind('fFirm','firm',true); bind('fPerson','person'); bind('fStatus','status');
  bind('fUrg','urgency'); bind('fFrom','from'); bind('fTo','to');
  bind('fQ','q'); bind('fArch','archived');

  $('fClear').addEventListener('click', function(){
    filters.firm = filters.person = filters.status = filters.urgency = '';
    filters.from = filters.to = filters.q = '';
    filters.archived = false;
    renderFilterBar(cache.directory);
    renderWorkTable();
  });
}

function renderWorkTable(){
  const host = $('tableHost');
  const statHost = $('statHost');
  if (!host) return;
  const rows = cache.tasks || [];
  const shown = sortByDeadline(applyFilters(rows));
  if (statHost) statHost.innerHTML = statTiles(computeStats(rows));
  host.innerHTML = taskTable(shown, { actions:true });

  host.querySelectorAll('[data-edit]').forEach(function(b){
    b.addEventListener('click', function(){ openTaskModal(b.dataset.edit); });
  });
  host.querySelectorAll('[data-arch]').forEach(function(b){
    b.addEventListener('click', function(){ archiveTask(b.dataset.arch); });
  });
  wireTaskOpen(host);
}

/* =====================================================================
   TASK DETAIL — status, attachments, conversation thread
   Opened on demand. The thread costs one read per message and is only
   fetched when a task is actually opened, never on the list screens.
   ===================================================================== */
async function openTaskDetail(taskId){
  const t = (cache.tasks || []).find(function(x){ return x.id === taskId; });
  if (!t){ toast('That task is no longer loaded. Refresh and try again.','err'); return; }

  const mine = t.assigneeEmail === myEmail();
  const canEdit = isAdmin() || mine;
  const u = urgency(t.deadline, t.status);

  openModal({
    title: t.title,
    body:
      '<div class="detail-meta">' +
        '<div><span>Assigned to</span><strong>' + esc(t.assigneeName || t.assigneeEmail) + '</strong></div>' +
        '<div><span>Firm</span><strong>' + esc(t.firmName || '—') + '</strong></div>' +
        '<div><span>Deadline</span><strong>' + fmtDate(t.deadline) + '</strong></div>' +
        '<div><span>Urgency</span><strong>' + pill(u) + '</strong></div>' +
        '<div><span>Priority</span><strong>' + esc(PRIORITY[t.priority] || 'Normal') + '</strong></div>' +
      '</div>' +
      (t.description ? '<div class="detail-desc">' + esc(t.description) + '</div>' : '') +

      (canEdit ?
        '<div><div class="sec-title">Status</div>' +
          '<div class="row mt16">' +
            '<select id="dStatus" class="ctl">' +
              Object.keys(STATUS).map(function(k){
                return '<option value="' + k + '"' + (t.status === k ? ' selected' : '') + '>' + STATUS[k].label + '</option>';
              }).join('') + '</select>' +
            '<button class="btn btn-navy btn-sm" id="dSaveStatus">Update status</button>' +
          '</div></div>'
        : '<div><div class="sec-title">Status</div><div class="mt16">' + statusPill(t.status) + '</div></div>') +

      '<div><div class="sec-title">Attachments</div>' +
        '<div class="attach-list mt16" id="dAttach"></div>' +
        (canEdit ?
          '<div class="attach-add mt16">' +
            '<div class="form-field"><label>File name</label><input id="aName" placeholder="e.g. IPR document"></div>' +
            '<div class="form-field"><label>Link</label><input id="aUrl" placeholder="https://drive.google.com/…"></div>' +
            '<button class="btn btn-ghost btn-sm" id="dAddAttach">Add</button>' +
          '</div>' +
          '<div class="hint tiny mt16">Upload the file to Google Drive, set sharing, then paste the link here.</div>'
          : '') +
      '</div>' +

      (isAdmin() ? chaseSectionHtml(t) : '') +

      '<div><div class="sec-title">Conversation</div>' +
        '<div class="thread mt16" id="dThread"><div class="loading-row"><div class="spinner sm"></div> Loading messages…</div></div>' +
        '<div class="compose mt16">' +
          '<textarea id="dMsg" placeholder="' + (isAdmin() ? 'Message to ' + esc((t.assigneeName||'').split(' ')[0] || 'this person') + '…' : 'Reply to IAMUSAP…') + '"></textarea>' +
          '<div class="row"><button class="btn btn-primary btn-sm" id="dPost">Post message</button>' +
            '<span class="tiny muted">Appears in their dashboard immediately.</span></div>' +
        '</div>' +
      '</div>' +
      '<div id="dErr"></div>',

function renderAttachments(root, t, canEdit){
  const host = root.querySelector('#dAttach');
  const list = t.attachments || [];
  if (!list.length){
    host.innerHTML = '<p class="small muted">Nothing attached yet.</p>';
    return;
  }
  host.innerHTML = list.map(function(a, i){
    return '<div class="attach">' +
      '<div><div class="an"><a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.name || a.url) + '</a></div>' +
      '<div class="au">Added by ' + esc(a.addedBy || '—') + ' · ' + fmtDate(a.addedAt) + '</div></div>' +
      '<div class="spacer"></div>' +
      (canEdit ? '<button class="btn-icon" data-rmattach="' + i + '">Remove</button>' : '') +
    '</div>';
  }).join('');
  host.querySelectorAll('[data-rmattach]').forEach(function(b){
    b.addEventListener('click', function(){ removeAttachment(root, t, parseInt(b.dataset.rmattach, 10)); });
  });
}

async function addAttachment(root, t){
  const nameEl = root.querySelector('#aName');
  const urlEl = root.querySelector('#aUrl');
  const errBox = root.querySelector('#dErr');
  const name = nameEl.value.trim();
  const url = urlEl.value.trim();

  if (!url){ errBox.innerHTML = '<div class="notice">Paste the link to the file.</div>'; return; }
  if (!/^https?:\/\//i.test(url)){ errBox.innerHTML = '<div class="notice">The link must start with http:// or https://</div>'; return; }

  const entry = { name: name || url, url: url, addedBy: myEmail(), addedAt: TS.fromDate(new Date()) };
  const list = (t.attachments || []).concat([entry]);

  try {
    await db.collection('tasks').doc(t.id).update({ attachments: list, updatedAt: FV.serverTimestamp() });
    t.attachments = list;
    nameEl.value = ''; urlEl.value = '';
    errBox.innerHTML = '';
    renderAttachments(root, t, true);
    toast('Attachment added', 'ok');
  } catch (err){
    console.error(err);
    errBox.innerHTML = '<div class="notice"><strong>Could not attach</strong>' + esc(err.message || String(err)) + '</div>';
  }
}

async function removeAttachment(root, t, index){
  const list = (t.attachments || []).slice();
  list.splice(index, 1);
  try {
    await db.collection('tasks').doc(t.id).update({ attachments: list, updatedAt: FV.serverTimestamp() });
    t.attachments = list;
    renderAttachments(root, t, true);
    toast('Attachment removed', 'ok');
  } catch (err){
    console.error(err);
    toast('Could not remove: ' + (err.message || err.code), 'err');
  }
}

async function loadThread(root, t){
  const host = root.querySelector('#dThread');
  try {
    const snap = await readQuery(
      db.collection('tasks').doc(t.id).collection('thread').orderBy('createdAt','asc').limit(100)
    );
    const msgs = [];
    snap.forEach(function(d){ const m = d.data() || {}; m.id = d.id; msgs.push(m); });
    renderThread(host, msgs);
  } catch (err){
    console.error(err);
    host.innerHTML = '<p class="small muted">Could not load messages: ' + esc(err.message || String(err)) + '</p>';
  }
}

function renderThread(host, msgs){
  if (!msgs.length){
    host.innerHTML = '<p class="small muted">No messages yet. Anything posted here is kept with the task permanently.</p>';
    return;
  }
  host.innerHTML = msgs.map(function(m){
    const mine = m.authorEmail === myEmail();
    const channel = m.channel && m.channel !== 'app'
      ? ' <span class="pill pill-grey">' + esc(m.channel) + '</span>' : '';
    return '<div class="msg' + (mine ? ' mine' : '') + (m.authorRole === 'admin' ? ' admin-msg' : '') + '">' +
      '<div class="msg-head"><span class="msg-who">' + esc(m.authorName || m.authorEmail) + '</span>' +
        channel +
        '<span class="msg-when">' + fmtDateTime(m.createdAt) + '</span></div>' +
      '<div class="msg-body">' + esc(m.body) + '</div></div>';
  }).join('');
  host.scrollTop = host.scrollHeight;
}

function fmtDateTime(v){
  const d = toDate(v);
  if (!d) return 'just now';
  return d.toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

async function postMessage(root, t){
  const box = root.querySelector('#dMsg');
  const btn = root.querySelector('#dPost');
  const errBox = root.querySelector('#dErr');
  const body = box.value.trim();
  if (!body){ errBox.innerHTML = '<div class="notice">Type a message first.</div>'; return; }

  btn.disabled = true;
  btn.textContent = 'Posting…';

  const msg = clean({
    body: body,
    authorEmail: myEmail(),
    authorName: session.profile.name || myEmail(),
    authorRole: session.role,
    channel: 'app',
    direction: isAdmin() ? 'outbound' : 'inbound',
    loggedManually: false,
    createdAt: FV.serverTimestamp()
  });

  try {
    await db.collection('tasks').doc(t.id).collection('thread').add(msg);
    await db.collection('tasks').doc(t.id).update({
      msgCount: (t.msgCount || 0) + 1,
      lastMessageAt: FV.serverTimestamp(),
      lastMessageBy: myEmail(),
      unreadForAdmin: !isAdmin(),
      unreadForAssignee: isAdmin(),
      updatedAt: FV.serverTimestamp()
    });
    t.msgCount = (t.msgCount || 0) + 1;
    t.unreadForAdmin = !isAdmin();
    t.unreadForAssignee = isAdmin();
    box.value = '';
    errBox.innerHTML = '';
    await loadThread(root, t);
    toast('Message posted', 'ok');
  } catch (err){
    console.error(err);
    errBox.innerHTML = '<div class="notice"><strong>Could not post</strong>' + esc(err.message || String(err)) + '</div>';
  }
  btn.disabled = false;
  btn.textContent = 'Post message';
}

/* Clear my own unread flag when I open the task. */
async function markRead(t){
  const field = isAdmin() ? 'unreadForAdmin' : 'unreadForAssignee';
  if (!t[field]) return;
  const patch = {};
  patch[field] = false;
  patch.updatedAt = FV.serverTimestamp();
  try {
    await db.collection('tasks').doc(t.id).update(patch);
    t[field] = false;
    updateNotifBadge();
  } catch (err){
    console.error('markRead failed', err);
  }
}

async function saveTask(taskId, root){
  const btn = root.querySelector('#tSave');
  const errBox = root.querySelector('#tErr');
  const title = root.querySelector('#tTitle').value.trim();
  const desc  = root.querySelector('#tDesc').value.trim();
  const who   = root.querySelector('#tWho').value;
  const due   = root.querySelector('#tDue').value;
  const pri   = root.querySelector('#tPri').value;
  const stEl  = root.querySelector('#tStatus');

  if (!title){ errBox.innerHTML = '<div class="notice">Give the task a title.</div>'; return; }
  if (!who){ errBox.innerHTML = '<div class="notice">Choose who this is for.</div>'; return; }
  if (!due){ errBox.innerHTML = '<div class="notice">Set a deadline.</div>'; return; }

  const dueDate = startOfDay(new Date(due));
  if (isNaN(dueDate.getTime())){ errBox.innerHTML = '<div class="notice">That deadline is not a valid date.</div>'; return; }

  const person = (cache.directory.people || []).find(function(p){ return p.email === who; });
  if (!person){ errBox.innerHTML = '<div class="notice">That person is no longer in the directory. Close and reopen this form.</div>'; return; }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  const payload = clean({
    title:title, description:desc,
    assigneeEmail:person.email, assigneeName:person.name,
    firmId:person.firmId || '', firmName:person.firmName || '',
    deadline: TS.fromDate(dueDate),
    priority: pri || 'normal',
    updatedAt: FV.serverTimestamp()
  });

  try {
    if (taskId){
      const newStatus = stEl ? stEl.value : 'not_started';
      payload.status = newStatus;
      payload.completedDate = newStatus === 'completed' ? TS.fromDate(new Date()) : null;
      await db.collection('tasks').doc(taskId).update(payload);
      const local = (cache.tasks || []).find(function(x){ return x.id === taskId; });
      if (local) Object.assign(local, payload, { deadline: TS.fromDate(dueDate) });
      toast('Task updated', 'ok');
    } else {
      payload.status = 'not_started';
      payload.completedDate = null;
      payload.assignedDate = TS.fromDate(new Date());
      payload.attachments = [];
      payload.msgCount = 0;
      payload.archived = false;
      payload.unreadForAssignee = true;
      payload.unreadForAdmin = false;
      payload.createdBy = myEmail();
      payload.createdAt = FV.serverTimestamp();
      const ref = await db.collection('tasks').add(payload);
      const local = Object.assign({}, payload, {
        id: ref.id, deadline: TS.fromDate(dueDate), assignedDate: TS.fromDate(new Date())
      });
      cache.tasks = cache.tasks || [];
      cache.tasks.push(local);
      toast('Task assigned to ' + person.name, 'ok');
    }
    closeModal();
    reroute();
  } catch (err){
    console.error(err);
    btn.disabled = false;
    btn.textContent = taskId ? 'Save changes' : 'Assign task';
    errBox.innerHTML = '<div class="notice"><strong>Could not save</strong>' + esc(err.message || String(err)) + '</div>';
  }
}

function archiveTask(taskId){
  const t = (cache.tasks || []).find(function(x){ return x.id === taskId; });
  if (!t) return;
  const restoring = !!t.archived;
  confirmDialog(
    restoring ? 'Restore this task?' : 'Archive this task?',
    restoring ? 'It will reappear in the main list.'
      : '"' + t.title + '" will be hidden from the main list. Nothing is deleted — the task and its replies are kept, and you can bring it back with the Archived filter.',
    restoring ? 'Restore' : 'Archive',
    async function(){
      try {
        await db.collection('tasks').doc(taskId).update({ archived: !restoring, updatedAt: FV.serverTimestamp() });
        t.archived = !restoring;
        toast(restoring ? 'Task restored' : 'Task archived', 'ok');
        renderWorkTable();
      } catch (err){
        console.error(err);
        toast('Could not archive: ' + (err.message || err.code), 'err');
      }
    }
  );
}

async function saveFirm(firmId, root){
  const btn = root.querySelector('#fSave');
  const errBox = root.querySelector('#fErr');
  const name  = root.querySelector('#fName').value.trim();
  const mail  = root.querySelector('#fMail').value.trim();
  const phone = root.querySelector('#fPhone').value.trim();
  const actEl = root.querySelector('#fActive');

  if (!name){ errBox.innerHTML = '<div class="notice">Give the firm a name.</div>'; return; }

  const dir = cache.directory;
  const id = firmId || slugify(name);

  if (!firmId && dir.firms.some(function(x){ return x.id === id; })){
    errBox.innerHTML = '<div class="notice">A firm with a very similar name already exists.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  const active = actEl ? actEl.value === 'yes' : true;
  const payload = clean({
    name:name, contactEmail:mail, contactPhone:phone,
    active:active, updatedAt: FV.serverTimestamp()
  });
  if (!firmId) payload.createdAt = FV.serverTimestamp();

  try {
    await db.collection('firms').doc(id).set(payload, { merge:true });

    const entry = { id:id, name:name, active:active, contactEmail:mail, contactPhone:phone };
    const idx = dir.firms.findIndex(function(x){ return x.id === id; });
    if (idx >= 0) dir.firms[idx] = entry; else dir.firms.push(entry);

    dir.people.forEach(function(p){ if (p.firmId === id) p.firmName = name; });

    await saveDirectory();
    toast(firmId ? 'Firm updated' : 'Firm added', 'ok');
    closeModal();
    reroute();
  } catch (err){
    console.error(err);
    btn.disabled = false;
    btn.textContent = firmId ? 'Save changes' : 'Add firm';
    errBox.innerHTML = '<div class="notice"><strong>Could not save</strong>' + esc(err.message || String(err)) + '</div>';
  }
}

async function savePerson(existingEmail, root){
  const btn = root.querySelector('#pSave');
  const errBox = root.querySelector('#pErr');
  const name = root.querySelector('#pName').value.trim();
  const mail = (existingEmail || root.querySelector('#pMail').value).trim().toLowerCase();
  const firmId = root.querySelector('#pFirm').value;
  const role = root.querySelector('#pRole').value;
  const active = root.querySelector('#pActive').value === 'yes';
  const phone = root.querySelector('#pPhone').value.trim();

  if (!name){ errBox.innerHTML = '<div class="notice">Enter their name.</div>'; return; }
  if (!validEmail(mail)){ errBox.innerHTML = '<div class="notice">That does not look like a valid email address.</div>'; return; }
  if (!firmId){ errBox.innerHTML = '<div class="notice">Choose a firm.</div>'; return; }

  const dir = cache.directory;
  if (!existingEmail && dir.people.some(function(x){ return x.email === mail; })){
    errBox.innerHTML = '<div class="notice">That email is already registered.</div>';
    return;
  }
  if (mail === myEmail() && (role !== 'admin' || !active)){
    errBox.innerHTML = '<div class="notice"><strong>Not allowed</strong>You cannot remove your own admin access or deactivate yourself — you would be locked out of the app.</div>';
    return;
  }

  const firm = dir.firms.find(function(f){ return f.id === firmId; });
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const payload = clean({
    email:mail, name:name, role:role,
    firmId:firmId, firmName: firm ? firm.name : '',
    phone:phone, active:active,
    updatedAt: FV.serverTimestamp()
  });
  if (!existingEmail) payload.createdAt = FV.serverTimestamp();

  try {
    await db.collection('users').doc(mail).set(payload, { merge:true });

    const entry = {
      email:mail, name:name, role:role, firmId:firmId,
      firmName: firm ? firm.name : '', phone:phone, active:active
    };
    const idx = dir.people.findIndex(function(x){ return x.email === mail; });
    if (idx >= 0) dir.people[idx] = entry; else dir.people.push(entry);

    await saveDirectory();
    toast(existingEmail ? 'Person updated' : name + ' can now sign in', 'ok');
    closeModal();
    reroute();
  } catch (err){
    console.error(err);
    btn.disabled = false;
    btn.textContent = existingEmail ? 'Save changes' : 'Add person';
    errBox.innerHTML = '<div class="notice"><strong>Could not save</strong>' + esc(err.message || String(err)) + '</div>';
  }
}

/* Single place that writes a thread message and keeps the task's counters
   in step. Everything — in-app, WhatsApp, email, logged phone call —
   goes through here, which is what makes real two-way sync a drop-in
   later rather than a rewrite. */
async function addThreadMessage(t, opts){
  const msg = clean({
    body: opts.body,
    authorEmail: myEmail(),
    authorName: opts.authorNameOverride || session.profile.name || myEmail(),
    authorRole: session.role,
    channel: opts.channel || 'app',
    direction: opts.direction || 'outbound',
    loggedManually: !!opts.loggedManually,
    loggedBy: opts.loggedManually ? myEmail() : null,
    externalId: null,
    createdAt: FV.serverTimestamp()
  });
  await db.collection('tasks').doc(t.id).collection('thread').add(msg);
  await db.collection('tasks').doc(t.id).update({
    msgCount: (t.msgCount || 0) + 1,
    lastMessageAt: FV.serverTimestamp(),
    lastMessageBy: myEmail(),
    unreadForAdmin: !isAdmin(),
    unreadForAssignee: isAdmin(),
    updatedAt: FV.serverTimestamp()
  });
  t.msgCount = (t.msgCount || 0) + 1;
}

async function loadClients(force){
  if (cache.clients && !force) return cache.clients;
  const snap = await readQuery(db.collection('clients').limit(300));
  const rows = [];
  snap.forEach(function(d){ const c = d.data() || {}; c.id = d.id; rows.push(c); });
  cache.clients = rows;
  return rows;
}

/* Flatten every client's items into one dated list, sorted soonest first. */
function upcomingCompliance(clients){
  const out = [];
  clients.forEach(function(c){
    if (c.active === false) return;
    (c.complianceItems || []).forEach(function(item){
      if (item.active === false) return;
      out.push({
        clientId: c.id, clientName: c.name, company: c.company || '',
        email: c.email || '', phone: c.phone || '',
        code: item.code || '', label: item.label || item.code || 'Item',
        month: item.month, day: item.day,
        due: nextComplianceDate(item.month, item.day),
        lastReminderAt: item.lastReminderAt || null
      });
    });
  });
  return out.sort(function(a,b){ return a.due - b.due; });
}

async function saveClient(clientId, root, existing){
  const btn = root.querySelector('#cSave');
  const errBox = root.querySelector('#cErr');
  const name = root.querySelector('#cName').value.trim();
  if (!name){ errBox.innerHTML = '<div class="notice">Enter the client name.</div>'; return; }

  const items = [];
  root.querySelectorAll('[data-item]').forEach(function(cb){
    if (!cb.checked) return;
    const def = COMPLIANCE_CATALOG.find(function(x){ return x.code === cb.dataset.item; });
    const prev = existing[def.code] || {};
    items.push(clean({
      code: def.code, label: def.label, month: def.month, day: def.day,
      active: true,
      lastReminderAt: prev.lastReminderAt || null
    }));
  });

  btn.disabled = true;
  btn.textContent = 'Saving…';

  const payload = clean({
    name: name,
    company: root.querySelector('#cCompany').value.trim(),
    email: root.querySelector('#cMail').value.trim(),
    phone: root.querySelector('#cPhone').value.trim(),
    notes: root.querySelector('#cNotes').value.trim(),
    complianceItems: items,
    active: true,
    updatedAt: FV.serverTimestamp()
  });
  if (!clientId) payload.createdAt = FV.serverTimestamp();

  try {
    if (clientId){
      await db.collection('clients').doc(clientId).set(payload, { merge:true });
      const local = (cache.clients || []).find(function(x){ return x.id === clientId; });
      if (local) Object.assign(local, payload);
    } else {
      const ref = await db.collection('clients').add(payload);
      cache.clients = cache.clients || [];
      cache.clients.push(Object.assign({}, payload, { id: ref.id }));
    }
    toast(clientId ? 'Client updated' : 'Client added', 'ok');
    closeModal();
    reroute();
  } catch (err){
    console.error(err);
    btn.disabled = false;
    btn.textContent = clientId ? 'Save changes' : 'Add client';
    errBox.innerHTML = '<div class="notice"><strong>Could not save</strong>' + esc(err.message || String(err)) + '</div>';
  }
}

/* =====================================================================
   AUTOMATIC IN-APP REMINDERS
   When an admin opens the dashboard, any task falling due within 7 days
   (or already overdue) gets a reminder posted into its thread — which
   means it lands in that person's dashboard without you typing anything.
   A 3-day cooldown per task stops it nagging on every page load.

   The honest limit: this runs when the app is open. Nothing in a browser
   can fire at 9am while everyone is asleep. For that you need Google
   Apps Script (free, email only) or the paid WhatsApp Business API.
   ===================================================================== */
const AUTO_REMINDER_COOLDOWN_DAYS = 3;
const AUTO_REMINDER_MAX_PER_LOAD = 10;

function autoReminderText(t){
  const u = urgency(t.deadline, t.status);
  return 'Automatic reminder: “' + t.title + '” is due on ' + fmtDate(t.deadline) +
    ' (' + u.label + '). Current status: ' + (STATUS[t.status] || STATUS.not_started).label +
    '. Please update it when you can.';
}

function needsAutoReminder(t){
  if (t.archived || t.status === 'completed') return false;
  const k = urgency(t.deadline, t.status).key;
  if (k !== 'overdue' && k !== 'today' && k !== 'urgent' && k !== 'soon') return false;
  const last = toDate(t.lastAutoReminderAt);
  if (!last) return true;
  return (Date.now() - last.getTime()) > AUTO_REMINDER_COOLDOWN_DAYS * 86400000;
}

async function runAutoReminders(tasks){
  if (!isAdmin()) return 0;
  const due = tasks.filter(needsAutoReminder).slice(0, AUTO_REMINDER_MAX_PER_LOAD);
  if (!due.length) return 0;

  let sent = 0;
  for (let i = 0; i < due.length; i++){
    const t = due[i];
    try {
      await db.collection('tasks').doc(t.id).collection('thread').add(clean({
        body: autoReminderText(t),
        authorEmail: myEmail(),
        authorName: 'IAMUSAP',
        authorRole: 'admin',
        channel: 'app',
        direction: 'outbound',
        loggedManually: false,
        automatic: true,
        createdAt: FV.serverTimestamp()
      }));
      await db.collection('tasks').doc(t.id).update({
        msgCount: (t.msgCount || 0) + 1,
        lastMessageAt: FV.serverTimestamp(),
        lastMessageBy: myEmail(),
        lastAutoReminderAt: FV.serverTimestamp(),
        unreadForAssignee: true,
        updatedAt: FV.serverTimestamp()
      });
      t.msgCount = (t.msgCount || 0) + 1;
      t.lastAutoReminderAt = TS.fromDate(new Date());
      t.unreadForAssignee = true;
      sent++;
    } catch (err){
      console.error('auto-reminder failed for', t.id, err);
    }
  }
  return sent;
}

/* =====================================================================
   NEW-MESSAGE NOTIFICATIONS
   The bell in the top bar counts tasks with activity you have not seen.
   Same mechanism for admin and partner — only the flag differs.
   ===================================================================== */
function unreadTasks(){
  const rows = cache.tasks || [];
  return rows.filter(function(t){
    if (t.archived) return false;
    return isAdmin() ? t.unreadForAdmin : t.unreadForAssignee;
  });
}

  const list = sortByDeadline(unreadTasks());
  openModal({
    title: list.length ? 'New messages (' + list.length + ')' : 'No new messages',
    narrow: true,
    body: list.length
      ? '<p class="small muted">Tasks with activity you have not opened yet.</p>' +
        '<div class="notif-list">' + list.map(function(t){
          const u = urgency(t.deadline, t.status);
          return '<button class="notif" data-notif="' + esc(t.id) + '">' +
            '<span class="unread-dot"></span>' +
            '<span><span class="notif-title">' + esc(t.title) + '</span>' +
            '<span class="notif-sub">' +
              (isAdmin() ? esc(t.assigneeName || t.assigneeEmail) : 'From IAMUSAP') +
              ' · ' + esc(u.label) + '</span></span></button>';
        }).join('') + '</div>'
      : '<p class="small muted">Nothing new. Messages appear here when someone posts on a task.</p>',
    foot: '<button class="btn btn-ghost" data-close>Close</button>' +
          (list.length ? '<button class="btn btn-primary" id="nMarkAll">Mark all as read</button>' : ''),
    onReady: function(root){
      root.querySelectorAll('[data-notif]').forEach(function(b){
        b.addEventListener('click', function(){
          closeModal();
          openTaskDetail(b.dataset.notif);
        });
      });
      const ma = root.querySelector('#nMarkAll');
      if (ma) ma.addEventListener('click', async function(){
        ma.disabled = true;
        ma.textContent = 'Marking…';
        for (let i = 0; i < list.length; i++){ await markRead(list[i]); }
        updateNotifBadge();
        closeModal();
        toast('All marked as read', 'ok');
        reroute();
      });
    }
  });
}

/* ---------- wiring ---------- */
$('btnSignin').addEventListener('click', signIn);
$('btnNotif').addEventListener('click', openNotifications);
$('btnSignout').addEventListener('click', signOut);
$('btnBlockedOut').addEventListener('click', signOut);
$('btnBlockedRetry').addEventListener('click', function(){ cache.invalidate('profile'); location.reload(); });

/* ---------- self-test ---------- */
(function selfTest(){
  const day = 86400000, now = Date.now();
  const cases = [
    [new Date(now - 3*day),'not_started','overdue'],
    [new Date(now),'not_started','today'],
    [new Date(now + 2*day),'in_progress','urgent'],
    [new Date(now + 5*day),'not_started','soon'],
    [new Date(now + 30*day),'not_started','later'],
    [new Date(now - 3*day),'completed','done'],
    [null,'not_started','none']
  ];
  let pass = 0;
  cases.forEach(function(c){
    const got = urgency(c[0], c[1]).key;
    if (got === c[2]) pass++; else console.warn('Urgency failed:', c, 'got', got);
  });

  const savedRole = session.role, savedUser = session.user;
  session.role = 'partner';
  session.user = { email:'Test.Person@Example.COM' };
  const scoped = myEmail() === 'test.person@example.com';
  session.role = savedRole;
  session.user = savedUser;

  const sample = [
    { id:'1', title:'GST filing',   assigneeEmail:'a@x.com', firmId:'olive',   status:'not_started', deadline:new Date(now + day) },
    { id:'2', title:'IPR document', assigneeEmail:'b@x.com', firmId:'mission', status:'completed',   deadline:new Date(now - day) },
    { id:'3', title:'Site visit',   assigneeEmail:'a@x.com', firmId:'olive',   status:'blocked',     deadline:new Date(now + 40*day), archived:true }
  ];
  const saved = JSON.parse(JSON.stringify(filters));
  filters.firm='olive'; filters.person=''; filters.status=''; filters.urgency='';
  filters.from=''; filters.to=''; filters.q=''; filters.archived=false;
  const f1 = applyFilters(sample).length === 1;
  filters.firm=''; filters.q='ipr';
  const f2 = applyFilters(sample).length === 1;
  filters.q=''; filters.archived=true;
  const f3 = applyFilters(sample).length === 1;
  Object.assign(filters, saved);

  const st = computeStats(sample);
  const s1 = st.completed === 1 && st.overdue === 0 && st.total === 2;
  const sorted = sortByDeadline(sample);
  const s2 = sorted[0].id === '2';

  console.log('IAMUSAP self-test — urgency ' + pass + '/' + cases.length +
    ' | email scoping ' + (scoped ? 'OK' : 'FAILED') +
    ' | filters ' + ((f1 && f2 && f3) ? 'OK' : 'FAILED') +
    ' | stats ' + (s1 ? 'OK' : 'FAILED') +
    ' | sort ' + (s2 ? 'OK' : 'FAILED') +
    ' | next ITR ' + fmtDate(nextComplianceDate(10,31)));
})();
</script>
